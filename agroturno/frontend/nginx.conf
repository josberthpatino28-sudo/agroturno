server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las peticiones a la API se reenvían al contenedor del backend
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Rutas de React Router: cualquier ruta desconocida devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
